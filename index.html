<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>stapp — 3D logo</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050506; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 800px at 50% 38%, #16181d 0%, #0a0a0c 45%, #050506 100%);
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .wordmark {
    position: fixed;
    left: 0; right: 0;
    bottom: clamp(24px, 7vh, 90px);
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.06em;
    font-size: clamp(38px, 11vw, 130px);
    color: rgba(240, 240, 242, 0.06);
    user-select: none;
    pointer-events: none;
    text-transform: lowercase;
  }
  .hint {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 18px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="wordmark">stapp</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const container = document.getElementById('app');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------- soft studio backdrop ----------
function gradientTexture(stops) {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------- scene / camera ----------
const scene = new THREE.Scene();
scene.background = gradientTexture([
  [0.0, '#262a34'], [0.5, '#171920'], [1.0, '#0b0c10'],
]);

// long lens, well back -> near-orthographic, minimal perspective distortion
const camera = new THREE.PerspectiveCamera(20, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(10, 6.5, 49);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 26;
controls.maxDistance = 90;
controls.target.set(0, 0, 0);

// ---------- lights (soft three-point studio setup) ----------
scene.add(new THREE.HemisphereLight(0xe9eef7, 0x20222c, 0.55));

const key = new THREE.DirectionalLight(0xfff4e6, 1.25);
key.position.set(8, 13, 11);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
key.shadow.camera.left = -20;
key.shadow.camera.right = 20;
key.shadow.camera.top = 20;
key.shadow.camera.bottom = -20;
key.shadow.bias = -0.0004;
key.shadow.radius = 7;
scene.add(key);

const fill = new THREE.DirectionalLight(0xccdcff, 0.5);
fill.position.set(-11, 1, 8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7);
rim.position.set(-5, 7, -11);
scene.add(rim);

// soft contact shadow on an invisible floor
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -8.6;
ground.receiveShadow = true;
scene.add(ground);

// ---------- the logo ----------
const logo = new THREE.Group();
scene.add(logo);

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xdcdee1, metalness: 0.0, roughness: 0.6,
});
const greenMat = new THREE.MeshStandardMaterial({
  color: 0x84f04e, metalness: 0.0, roughness: 0.46,
  emissive: 0x3aa626, emissiveIntensity: 0.45,
});

const D = 1.2;                    // extrude depth of the S arms
// map source-image pixels -> world units (logo centre ≈ px 226,240)
const CX = 226, CY = 240, SC = 38;
const P = (px, py) => new THREE.Vector2((px - CX) / SC, (CY - py) / SC);

// The "stapp" S is point-symmetric: two arm shapes, each also used rotated 180°.
// Shape A = a horizontal stroke with a descending leg (angled foot) on the left.
// Shape B = a horizontal stroke with a stepped drop on the right.
const shapeAPts = [
  P(6, 6), P(232, 6), P(232, 82), P(84, 82), P(84, 232), P(6, 205),
];
const shapeBPts = [
  P(250, 6), P(445, 6), P(445, 112), P(382, 112), P(382, 82), P(250, 82),
];

function shapeFrom(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i].x, pts[i].y);
  s.closePath();
  return s;
}

const extrudeSettings = {
  depth: D, bevelEnabled: true,
  bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 1, curveSegments: 1,
};

function armGeo(pts) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(pts), extrudeSettings);
  g.translate(0, 0, -(D / 2) - 0.05);   // centre on Z
  return g;
}

const geoA = armGeo(shapeAPts);
const geoB = armGeo(shapeBPts);

const topLeft  = new THREE.Mesh(geoA, bodyMat);
const botRight = new THREE.Mesh(geoA, bodyMat); botRight.rotation.z = Math.PI;
const topRight = new THREE.Mesh(geoB, bodyMat);
const botLeft  = new THREE.Mesh(geoB, bodyMat); botLeft.rotation.z = Math.PI;
logo.add(topLeft, botRight, topRight, botLeft);

// mid bar — a clean parallelogram (vertical ends, 14° slanted top & bottom),
// traced to the same proportions and placement as the source art.
const midDepth = 1.3;
const midShape = shapeFrom([P(86, 158), P(368, 228), P(368, 308), P(86, 238)]);
const midGeo = new THREE.ExtrudeGeometry(midShape, {
  depth: midDepth, bevelEnabled: true,
  bevelThickness: 0.05, bevelSize: 0.06, bevelSegments: 2, curveSegments: 1,
});
midGeo.translate(0, 0, -midDepth / 2 + 0.25);   // sits a little proud of the arms
const midBar = new THREE.Mesh(midGeo, greenMat);
logo.add(midBar);

for (const m of logo.children) { m.castShadow = true; m.receiveShadow = true; }

// resting pose
logo.rotation.x = -0.12;
logo.rotation.z = 0.0;

// ---------- particles ----------
const pCount = 280;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  const r = 22 + Math.random() * 34;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
  pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
  pPos[i*3+2] = r * Math.cos(ph);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0x5b6b82, size: 0.06, transparent: true, opacity: 0.45, depthWrite: false,
}));
scene.add(particles);

// ---------- postprocessing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.12, 0.5, 0.85
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- resize ----------
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

// ---------- animate ----------
// add #still to the URL to hold the logo face-on (orbit + zoom still work)
const spin = !location.hash.includes('still');
const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (spin) {
    logo.rotation.y += dt * 0.35;
    logo.rotation.x = -0.12 + Math.sin(t * 0.45) * 0.06;
    logo.position.y = Math.sin(t * 0.9) * 0.15;
  }

  greenMat.emissiveIntensity = 0.42 + Math.sin(t * 2.0) * 0.06;

  particles.rotation.y += dt * 0.02;

  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
